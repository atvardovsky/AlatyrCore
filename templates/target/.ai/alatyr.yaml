schema_version: "{ALATYR_ADAPTER_SCHEMA_VERSION}"
framework:
  name: "Alatyr Core"
  version: "{ALATYR_CORE_VERSION}"
  source: "{ALATYR_CORE_SOURCE}"
  template_version: "{ALATYR_TEMPLATE_VERSION}"
  rule_registry: ".ai/framework/rule-registry.json"
installation:
  id: "{INSTALLATION_ID}"
  date: "{INSTALLATION_DATE}"
  mode: "{NEW_INSTALL_OR_UPGRADE}"
  support_profile: "{CORE_STANDARD_OR_FULL}"
owner:
  responsible_team: "{RESPONSIBLE_TEAM}"
  technical_owner: "{TECHNICAL_OWNER}"
  backup_owner: "{BACKUP_OWNER}"
  last_review_date: "{LAST_REVIEW_DATE}"
  review_cadence: "{TARGET_ADAPTER_REVIEW_CADENCE}"
  codeowners: "{CODEOWNERS_OR_EQUIVALENT_OWNER_MAP}"
  review_triggers:
    - "{REVIEW_TRIGGER}"
supported_assistants:
  - "{SUPPORTED_ASSISTANT}"
contours:
  framework: ".ai/framework"
  project: ".ai/project"
  assistant: ".ai/assistant"
source_of_truth:
  project_contour: ".ai/project/contour.md"
  registry: ".ai/project/source-of-truth-registry.md"
  development_evidence: ".ai/project/development-evidence.json"
  consistency_map: ".ai/project/consistency-map.json"
  architecture_index: ".ai/project/architecture/README.md"
  architecture_catalog: ".ai/project/architecture/catalog.json"
  code_documentation_index: ".ai/project/documentation/README.md"
  code_documentation_catalog: ".ai/project/documentation/catalog.json"
  code_documentation_profiles: ".ai/project/documentation/profiles.json"
  vocabulary_index: ".ai/project/vocabulary/README.md"
  vocabulary_catalog: ".ai/project/vocabulary/catalog.json"
  vocabulary_terms: ".ai/project/vocabulary/terms.json"
  vocabulary_data_dictionary_links: ".ai/project/vocabulary/data-dictionary-links.json"
  testing_index: ".ai/project/testing/README.md"
  test_first_policy: ".ai/project/testing/test-first-policy.json"
  team_operating_model: ".ai/project/team-operating-model.md"
  assistant_contour: ".ai/assistant/contour.md"
  context_router: ".ai/assistant/context-router.json"
  context_profiles: ".ai/assistant/context-profiles.md"
  module_profile: ".ai/assistant/module-profile.md"
  project_sources:
    - "{TARGET_PROJECT_SOURCE_OF_TRUTH}"
context_routing:
  router_schema_version: 3
  preloaded_context:
    - "AGENTS.md"
  compact_bootstrap:
    - ".ai/alatyr.yaml"
    - ".ai/README.md"
    - ".ai/assistant/context-router.json"
  bootstrap_max_files: 4
  bootstrap_max_words: 2000
  profile_default_max_files: 12
  profile_default_max_words: 8000
  budget_behavior: "record expansion reason and load only required owners"
modules:
  core_profile: "{COMPLETE_OR_MISSING_GAPS}"
  enabled:
    - "{ENABLED_MODULE}"
  deferred:
    - "{DEFERRED_MODULE_AND_REASON}"
  blocked:
    - "{BLOCKED_MODULE_AND_MISSING_FACT}"
validation:
  commands:
    - name: "{VALIDATION_NAME}"
      command: "{TARGET_VALIDATION_COMMAND_OR_MANUAL_REVIEW}"
      required_for:
        - "{TASK_PROFILE}"
ai_infrastructure:
  router: ".ai/assistant/ai-infrastructure-router.json"
  inventory: ".ai/assistant/templates/ai-infrastructure-inventory.md"
  recommendation: ".ai/assistant/templates/ai-infrastructure-recommendation.md"
  adaptation_record: ".ai/assistant/templates/ai-infrastructure-adaptation-record.md"
extensions:
  index: ".ai/assistant/extensions/README.md"
  catalog: ".ai/assistant/extensions/catalog.json"
  lock: ".ai/assistant/extensions/lock.json"
  intent: ".ai/assistant/context/intents/extension-request.json"
  flow: ".ai/assistant/flows/extension-lifecycle.flow.md"
  gate: ".ai/assistant/gates/extensions.md"
  review: ".ai/assistant/templates/extension-review.md"
  lifecycle_record: ".ai/assistant/templates/extension-lifecycle-record.md"
operations:
  index: ".ai/assistant/operation-index.json"
  catalog: ".ai/assistant/operation-catalog.json"
  routing: ".ai/assistant/flows/operation-routing.flow.md"
  health: ".ai/assistant/flows/adapter-health.flow.md"
  pre_change_preview: ".ai/assistant/templates/pre-change-preview.md"
  diagram_discussion: ".ai/assistant/flows/diagram-discussion.flow.md"
  diagram_presentation: ".ai/assistant/templates/diagram-presentation.md"
  architecture_assistance: ".ai/assistant/flows/architecture-assistance.flow.md"
  architecture_discussion_result: ".ai/assistant/templates/architecture-discussion-result.md"
  documentation_sync: ".ai/assistant/flows/documentation-sync.flow.md"
  code_documentation_profile_review: ".ai/assistant/templates/code-documentation-profile-review.md"
  project_vocabulary: ".ai/assistant/flows/project-vocabulary.flow.md"
  vocabulary_term_review: ".ai/assistant/templates/vocabulary-term-review.md"
  test_first_configuration: ".ai/assistant/flows/test-first-configuration.flow.md"
  test_first_change: ".ai/assistant/flows/test-first-change.flow.md"
  test_first_evidence: ".ai/assistant/templates/test-first-evidence.md"
  help: ".ai/assistant/help.md"
  help_reference: ".ai/assistant/help-reference.md"
  operation_request: ".ai/assistant/templates/operation-request.md"
  installation_note: ".ai/assistant/templates/installation-note.md"
  output_contracts: ".ai/assistant/templates/adapter-output-contracts.md"
  large_task_packet: ".ai/assistant/templates/large-task-operation-packet.md"
  change_package_flow: ".ai/assistant/flows/change-package.flow.md"
  change_package_index: ".ai/assistant/change-packages/index.json"
  change_package_record: ".ai/assistant/templates/change-package-record.json"
  change_package_report: ".ai/assistant/templates/change-package-report.md"
  ai_infrastructure_inventory: ".ai/assistant/templates/ai-infrastructure-inventory.md"
  ai_infrastructure_recommendation: ".ai/assistant/templates/ai-infrastructure-recommendation.md"
  extension_management: ".ai/assistant/flows/extension-lifecycle.flow.md"
  extension_review: ".ai/assistant/templates/extension-review.md"
  extension_lifecycle_record: ".ai/assistant/templates/extension-lifecycle-record.md"
  development_evidence_capture: ".ai/assistant/flows/development-evidence-capture.flow.md"
  migration_note: ".ai/assistant/templates/migration-note.md"
  effectiveness_report: ".ai/assistant/templates/effectiveness-report.md"
team_collaboration:
  operating_model: ".ai/project/team-operating-model.md"
  context_overlay: ".ai/assistant/team/context-overlay.json"
  work_registry: ".ai/assistant/team/work-registry.json"
  gate: ".ai/assistant/gates/team-collaboration.md"
  coordination_backend: "{REPOSITORY_EXTERNAL_TRACKER_BOTH_OR_OTHER}"
  canonical_task_source: "{TARGET_TASK_SOURCE_OF_TRUTH}"
  synchronization_direction: "{BACKEND_TO_REGISTRY_REGISTRY_TO_BACKEND_BIDIRECTIONAL_OR_MANUAL}"
  record_storage: "{TARGET_TEAM_RECORD_STORAGE_POLICY}"
  retention_policy: "{TARGET_TEAM_RECORD_RETENTION_POLICY}"
  privacy_policy: "{TARGET_TEAM_RECORD_PRIVACY_POLICY}"
maturity:
  profile: ".ai/assistant/maturity-profile.md"
bridges:
  capability_matrix: ".ai/assistant/bridge-capability-matrix.md"
  capabilities: ".ai/assistant/assistant-capabilities.json"
approvals:
  directory: ".ai/assistant/approvals"
  template: ".ai/assistant/approvals/approval-template.md"
  machine_template: ".ai/assistant/approvals/approval-record-template.json"
change_packages:
  directory: ".ai/assistant/change-packages"
  index: ".ai/assistant/change-packages/index.json"
  machine_template: ".ai/assistant/templates/change-package-record.json"
  human_report_template: ".ai/assistant/templates/change-package-report.md"
  retention_policy: "{TARGET_CHANGE_PACKAGE_RETENTION_AND_REDACTION_POLICY}"
code_documentation:
  catalog: ".ai/project/documentation/catalog.json"
  profiles: ".ai/project/documentation/profiles.json"
  intent: ".ai/assistant/context/intents/code-documentation.json"
  flow: ".ai/assistant/flows/documentation-sync.flow.md"
  skill: ".ai/assistant/skills/code-documentation/SKILL.md"
  profile_review: ".ai/assistant/templates/code-documentation-profile-review.md"
project_vocabulary:
  catalog: ".ai/project/vocabulary/catalog.json"
  terms: ".ai/project/vocabulary/terms.json"
  data_dictionary_links: ".ai/project/vocabulary/data-dictionary-links.json"
  intent: ".ai/assistant/context/intents/vocabulary-request.json"
  flow: ".ai/assistant/flows/project-vocabulary.flow.md"
  skill: ".ai/assistant/skills/project-vocabulary/SKILL.md"
  term_review: ".ai/assistant/templates/vocabulary-term-review.md"
test_first_development:
  policy: ".ai/project/testing/test-first-policy.json"
  intent: ".ai/assistant/context/intents/test-first-request.json"
  configuration_flow: ".ai/assistant/flows/test-first-configuration.flow.md"
  change_flow: ".ai/assistant/flows/test-first-change.flow.md"
  gate: ".ai/assistant/gates/test-first-development.md"
  skill: ".ai/assistant/skills/test-first-development/SKILL.md"
  evidence: ".ai/assistant/templates/test-first-evidence.md"
policies:
  source_access: ".ai/assistant/policies/ai-infrastructure-source-access.md"
  prompt_injection: ".ai/assistant/policies/prompt-injection.md"
known_gaps:
  - "{KNOWN_GAP}"
local_deviations:
  - "{LOCAL_DEVIATION}"
