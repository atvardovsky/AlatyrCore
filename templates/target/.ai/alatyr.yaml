context_routing:
  router_schema_version: 8
  preloaded_context:
    - "AGENTS.md"
  compact_bootstrap:
    - ".ai/assistant/bootstrap-index.json"
  bootstrap_max_files: 2
  bootstrap_max_words: 1800
  profile_default_max_files: 12
  profile_default_max_total_words: 8000
  profile_default_max_portable_words: 5600
  profile_default_reserved_target_words: 2400
  budget_behavior: "load required safety and owner evidence, then record measured expansion"
  recursive_index_schema_version: 1
  recursive_index_max_depth: 8
  semantic_codebook_schema_version: 1
  semantic_preload_policy: "core definitions are embedded in the generated bootstrap; domain and project term shards remain conditional"
  context_packet_schema_version: 1
  context_packet_template: ".ai/assistant/templates/context-packet.json"
modules:
  core_profile: "{COMPLETE_OR_MISSING_GAPS}"
  enabled:
    - "{ENABLED_MODULE}"
  deferred:
    - "{DEFERRED_MODULE_AND_REASON}"
  blocked:
    - "{BLOCKED_MODULE_AND_MISSING_FACT}"
validation:
  commands:
    - name: "{VALIDATION_NAME}"
      command: "{TARGET_VALIDATION_COMMAND_OR_MANUAL_REVIEW}"
