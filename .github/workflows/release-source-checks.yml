name: Release source checks

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-checks:
    name: Full and release checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install source-check dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run full release profile
        run: python tools/check_all.py --profile release
