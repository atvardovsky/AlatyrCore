name: Release source checks

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-checks:
    name: Full and release checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints-ci.txt
      - name: Install source-check dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints-ci.txt
      - name: Verify source-check dependencies
        run: python -m pip check
      - name: Require current version tag on release commit
        run: python tools/check_versioning.py --require-current-tag
      - name: Run full release profile
        run: python tools/check_all.py --profile release --report "${{ runner.temp }}/alatyr-release-source-checks.json"
      - name: Upload release-check diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-source-checks
          path: ${{ runner.temp }}/alatyr-release-source-checks.json
          if-no-files-found: warn
          retention-days: 30
