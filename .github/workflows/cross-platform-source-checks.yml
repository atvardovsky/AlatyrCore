name: Cross-platform source checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    name: Source checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run source checks
        run: python tools/check_all.py
      - name: Check pull request contract drift
        if: github.event_name == 'pull_request'
        run: python tools/check_release_drift.py --mode change --from-ref ${{ github.event.pull_request.base.sha }}
      - name: Check pushed contract drift
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python tools/check_release_drift.py --mode change --from-ref ${{ github.event.before }}
